[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-engine"
version = "0.1.0"
description = "Customer-service RAG engine for Trevona ACO (Ollama + Postgres/pgvector)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "ollama>=0.4",
    "typer>=0.12",
    "discord.py>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rag = "rag_engine.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["rag_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
