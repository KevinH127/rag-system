[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_engine"]

[project]
name = "rag-system"
version = "0.1.0"
description = "A modular, local Retrieval-Augmented Generation (RAG) engine for customer support Q&A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Document loading
    "pypdf>=4.2",
    # Embeddings (local, no network)
    "fastembed>=0.3",
    # Database
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # LLM client
    "ollama>=0.2",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
rag = "rag_engine.cli:app"

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
]
perf = [
    "locust>=2.28",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
